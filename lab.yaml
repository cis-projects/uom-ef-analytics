lab:
  name: "School of Computing and Information Systems, Education-Focused Team"
  institution: "The University of Melbourne"
  expert: https://findanexpert.unimelb.edu.au/group/2014439-education-focused
  default_member: "Eduardo Oliveira"
  year: 2020
  reason: "when education-focused roles in the School became more clearly defined"

settings:
  # OpenAlex work types to leave out of every count
  exclude_types: [paratext, erratum, retraction, peer-review, editorial, letter, supplementary-materials]
  # Merge a preprint and its published version (same title) into one paper, like Google Scholar does
  merge_duplicate_titles: true
  # Papers with more authors than this are left out of the collaboration network
  # (huge consortium papers would otherwise connect everyone to everyone)
  network_max_authors: 50

# One entry per person. For each member give at least ONE of:
#   openalex: their OpenAlex author ID(s), e.g. A5023888391  (most reliable; a list is fine
#             when OpenAlex has split one person into several profiles)
#   orcid:    their ORCID iD
#   name only: matched by name + the lab institution above (check the result!)
# Find IDs with:  python scripts/fetch.py --find "Jane Doe"
