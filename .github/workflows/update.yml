name: Update dashboard

on:
  schedule:
    - cron: "17 3 1 * *"      # 03:17 UTC on the 1st of every month
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [lab.yaml, scripts/**, site/*.html, site/*.css, site/*.js, .github/workflows/**]

permissions:
  contents: write    # commit the refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history, so the data commit can be rebased if main moved meanwhile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch from OpenAlex and build data
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}        # optional: exact Google Scholar numbers
        run: python scripts/fetch.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(date -u +%Y-%m-%d)"
          # someone may have pushed while this run was working: replay our data commit on top and retry
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not save the refreshed data to the repo; the site is still published from this run."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
